name: SolarPayback quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Verify Cloudflare Pages output
        run: |
          test -s dist/index.html
          test -s dist/_worker.js
          test -s dist/assets/app.js
          test -s dist/assets/aurora.css
          test -s dist/src/engine.js
          test -s dist/_headers
