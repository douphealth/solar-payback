name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static analysis and regression tests
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Verify expected deployment assets
        run: |
          test -s dist/index.html
          test -s dist/assets/app.js
          test -s dist/lib/finance.mjs
          test -s dist/_headers
